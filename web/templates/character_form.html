{% extends "base.html" %}

{% block title %}Create Character - D&D Manager{% endblock %}

{% block content %}
<h1>Create Character</h1>

<form id="characterForm" class="form">
    <div class="form-group">
        <label for="name">Character Name</label>
        <input type="text" id="name" name="name" required>
    </div>

    <div class="form-group">
        <label for="class">Class</label>
        <select id="class" name="class" required>
            <option value="">Select a class</option>
            {% for cls in classes %}
            <option value="{{ cls }}">{{ cls }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="race">Race</label>
        <select id="race" name="race" required>
            <option value="Human">Human</option>
            {% for r in races %}
            <option value="{{ r }}">{{ r }}</option>
            {% endfor %}
        </select>
    </div>

    <div class="form-group">
        <label for="level">Level</label>
        <input type="number" id="level" name="level" min="1" max="20" value="1">
    </div>

    <fieldset class="abilities">
        <legend>Ability Scores</legend>
        <div class="ability-grid">
            <div class="ability-input">
                <label for="strength">STR</label>
                <input type="number" id="strength" name="strength" min="3" max="30" value="10">
            </div>
            <div class="ability-input">
                <label for="dexterity">DEX</label>
                <input type="number" id="dexterity" name="dexterity" min="3" max="30" value="10">
            </div>
            <div class="ability-input">
                <label for="constitution">CON</label>
                <input type="number" id="constitution" name="constitution" min="3" max="30" value="10">
            </div>
            <div class="ability-input">
                <label for="intelligence">INT</label>
                <input type="number" id="intelligence" name="intelligence" min="3" max="30" value="10">
            </div>
            <div class="ability-input">
                <label for="wisdom">WIS</label>
                <input type="number" id="wisdom" name="wisdom" min="3" max="30" value="10">
            </div>
            <div class="ability-input">
                <label for="charisma">CHA</label>
                <input type="number" id="charisma" name="charisma" min="3" max="30" value="10">
            </div>
        </div>
    </fieldset>

    <button type="submit" class="btn btn-primary">Create Character</button>
</form>

<script>
document.getElementById('characterForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const data = Object.fromEntries(formData);
    
    const response = await fetch('{{ url_for("new_character") }}', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(data)
    });
    
    if (response.ok) {
        alert('Character created!');
        window.location.href = '{{ url_for("characters") }}';
    }
});
</script>
{% endblock %}
